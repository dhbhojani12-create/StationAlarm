name: Build Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      - name: Publish APK as release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk StationAlarm.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk StationAlarm.apk --title "Station Alarm Android app" --notes "Latest build of Station Alarm. Download StationAlarm.apk on your phone and install." --latest

      - name: Save build log on failure
        if: failure()
        run: |
          cp /tmp/build.log /tmp/full.log 2>/dev/null || echo "no log" > /tmp/full.log
          git config user.name ci && git config user.email ci@example.com
          git checkout --orphan build-log
          git rm -rfq .
          tail -n 400 /tmp/full.log > build.log
          git add build.log && git commit -qm "build log" && git push -f origin build-log
