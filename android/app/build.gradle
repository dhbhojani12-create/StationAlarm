plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dhbhojani.stationalarm'
    compileSdk 34

    defaultConfig {
        applicationId 'com.dhbhojani.stationalarm'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }

    signingConfigs {
        fixed {
            storeFile file('stationalarm.jks')
            storePassword 'stationalarm'
            keyAlias 'stationalarm'
            keyPassword 'stationalarm'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
        debug {
            signingConfig signingConfigs.fixed
        }
    }

    androidResources {
        noCompress 'tsv'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
